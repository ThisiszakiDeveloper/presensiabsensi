<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d607d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="SiteNexs Presensi dalam tampilan mobile." />
    <title>SiteNexs Mobile | Presensi Kerja</title>
    <link rel="icon" type="image/png" href="sitenexs-icon.png" />
    <style>
      :root {
        color-scheme: light;
        background: #f5fafb;
        font-family: "DM Sans", Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      html, body, main {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      main {
        height: 100vh;
        height: 100dvh;
        padding:
          env(safe-area-inset-top, 0)
          env(safe-area-inset-right, 0)
          env(safe-area-inset-bottom, 0)
          env(safe-area-inset-left, 0);
        background: #f5fafb;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f5fafb;
      }

      .fallback {
        position: absolute;
        z-index: 1;
        inset: auto 16px 16px;
        padding: 10px 12px;
        border: 1px solid #dcebee;
        border-radius: 12px;
        color: #647985;
        background: #fff;
        font-size: 13px;
        text-align: center;
      }

      .fallback a { color: #087d91; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <iframe src="index.html" title="SiteNexs Presensi mobile" allow="camera; geolocation; fullscreen"></iframe>
      <noscript><p class="fallback">Aktifkan JavaScript agar dashboard mobile berjalan. <a href="index.html">Buka dashboard</a></p></noscript>
    </main>
  </body>
</html>
